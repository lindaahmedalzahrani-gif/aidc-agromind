apiVersion: apps/v1
kind: Deployment

metadata:
  name: agromind-vllm
  namespace: agromind-h100

spec:
  replicas: 1

  selector:
    matchLabels:
      app: agromind-vllm

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: agromind-vllm

    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.27.1

          args:
            - --model=Qwen/Qwen2.5-VL-7B-Instruct
            - --dtype=half
            - --max-model-len=20000
            - --gpu-memory-utilization=0.85

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"

            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 90
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5

          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface

      volumes:
        - name: hf-cache
          hostPath:
            path: /var/lib/hf-cache
            type: DirectoryOrCreate
