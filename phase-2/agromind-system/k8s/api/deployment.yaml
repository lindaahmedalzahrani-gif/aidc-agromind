apiVersion: apps/v1
kind: Deployment
metadata:
  name: agromind-api
  namespace: agromind-h100

spec:
  replicas: 1

  selector:
    matchLabels:
      app: agromind-api

  template:
    metadata:
      labels:
        app: agromind-api

    spec:
      containers:
        - name: api

          image: agromind-api:phase2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: agromind-api-config

          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: agromind-api-key
                  key: API_KEY

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "1"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
